# Site copy
hero:
  badge: "Free access for AAU Energy students · AI tools hosted locally at Aalborg University"
  headline: "AI in *Education* at AAU Energy"
  lead:

about:
  headline: Why AI in Education?
  lead: >
    AI can help students work faster and learn more effectively — both on its
    own and alongside your own teaching.
  body: >
    We host state-of-the-art AI tools and models here at AAU Energy, so you can
    use them without sharing data with external providers. The tools are free to
    use, tailored to AAU Energy courses, and designed to work with your existing
    workflows.
  benefits:
    - Free and open access for AAU Energy students
    - Always locally hosted — your data stays at Aalborg University
    - Tailored to AAU Energy courses and study curriculum
    - Authored and maintained by people at AAU Energy
  stats:
    - number: "3"
      label: Tools and counting
    - number: "1"
      label: Supervisors provided specialised reviewing styles
    - number: "100%"
      label: Locally hosted at Aalborg University
cta:
  headline: Got an AI-related idea?
  body: Get in touch and suggest your idea. We're always looking to add new tools to improve our education.

footer:
